<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hushline — a quiet run through the night relay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070f;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 720px;
    border: 1px solid #223055;
    box-shadow: 0 0 60px rgba(40, 90, 160, 0.18);
    background: #0b1020;
    cursor: crosshair;
    image-rendering: auto;
  }
  #fallback {
    position: absolute;
    color: #8fa6d8;
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="Hushline stealth game"></canvas>
<div id="fallback">Hushline needs JavaScript enabled.</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
